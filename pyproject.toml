[project]
name = "f1-race-analyst"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
